<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulateur Immobilier — Neuf · Ancien · Location</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #1e293b; cursor: pointer; }
    input[type=range].amber::-webkit-slider-thumb { background: #d97706; }
    input[type=range].violet::-webkit-slider-thumb { background: #7c3aed; }
    input[type=range].emerald::-webkit-slider-thumb { background: #059669; }
    .mono { font-family: 'Courier New', monospace; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
const {
  LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip,
  Legend, ResponsiveContainer, Cell, ReferenceLine
} = Recharts;

// ─── Formatters ──────────────────────────────────────────────────────────────
const fmt = (n, dec = 0) =>
  new Intl.NumberFormat('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n);
const fmtE = (n) => fmt(n) + ' €';
const fmtPct = (n) => fmt(n * 100, 1) + ' %';

// ─── PTZ 2026 data ───────────────────────────────────────────────────────────
const PTZ_ZONES = {
  'A bis': { t1: 25000, t2: 31000, t3: 37000, maxRevenu: 49000, maxOp: 150000 },
  'A':     { t1: 25000, t2: 31000, t3: 37000, maxRevenu: 49000, maxOp: 150000 },
  'B1':    { t1: 21500, t2: 26000, t3: 30000, maxRevenu: 34500, maxOp: 135000 },
  'B2':    { t1: 18000, t2: 22500, t3: 27000, maxRevenu: 31500, maxOp: 110000 },
  'C':     { t1: 15000, t2: 19500, t3: 24000, maxRevenu: 28500, maxOp: 100000 },
};
const PTZ_TRANCHES = [
  { quotite: 0.50, differe: 10, duree: 25 },
  { quotite: 0.40, differe: 8,  duree: 20 },
  { quotite: 0.40, differe: 2,  duree: 15 },
  { quotite: 0.20, differe: 0,  duree: 10 },
];

// ─── PTZ calculation ─────────────────────────────────────────────────────────
function calcPTZ(isNeuf, zone, rfr, coutTotal, travaux, prixBien) {
  const zd = PTZ_ZONES[zone];
  if (!zd) return { eligible: false, raison: 'Zone inconnue' };

  // Ancien: only B2 or C, AND travaux ≥ 25% of total
  if (!isNeuf) {
    if (zone !== 'B2' && zone !== 'C') {
      return { eligible: false, raison: `Zone ${zone} non éligible pour l'ancien (B2/C uniquement)` };
    }
    const ratioBrut = coutTotal > 0 ? travaux / coutTotal : 0;
    if (ratioBrut < 0.25) {
      return {
        eligible: false,
        raison: `Travaux insuffisants : ${fmt(ratioBrut * 100, 1)} % du coût total (seuil requis : 25 %)`,
      };
    }
  }

  const revenuRetenu = Math.max(rfr, coutTotal / 9);
  if (revenuRetenu > zd.maxRevenu) {
    return { eligible: false, raison: `Revenus trop élevés (${fmtE(Math.round(revenuRetenu))} > plafond ${fmtE(zd.maxRevenu)})` };
  }

  let trancheIdx;
  if (revenuRetenu <= zd.t1) trancheIdx = 0;
  else if (revenuRetenu <= zd.t2) trancheIdx = 1;
  else if (revenuRetenu <= zd.t3) trancheIdx = 2;
  else trancheIdx = 3;

  const tr = PTZ_TRANCHES[trancheIdx];
  const base = Math.min(coutTotal, zd.maxOp);
  const montant = base * tr.quotite;
  const dureeRemboursement = tr.duree - tr.differe;
  const mensualite = dureeRemboursement > 0 ? montant / (dureeRemboursement * 12) : 0;

  return {
    eligible: true,
    tranche: trancheIdx + 1,
    quotite: tr.quotite,
    differe: tr.differe,
    duree: tr.duree,
    dureeRemboursement,
    montant,
    mensualite,
    revenuRetenu,
  };
}

// ─── Loan monthly payment ─────────────────────────────────────────────────────
function mensualiteEmprunt(capital, tauxAnnuel, dureeAns) {
  if (capital <= 0) return 0;
  const r = tauxAnnuel / 12;
  const n = dureeAns * 12;
  if (r === 0) return capital / n;
  return capital * r / (1 - Math.pow(1 + r, -n));
}

// CRD prêt principal after t months
function crdPrincipal(capital, tauxAnnuel, dureeAns, tMois) {
  if (capital <= 0) return 0;
  const r = tauxAnnuel / 12;
  const n = dureeAns * 12;
  if (r === 0) return Math.max(0, capital - (capital / n) * tMois);
  const m = mensualiteEmprunt(capital, tauxAnnuel, dureeAns);
  const crd = capital * Math.pow(1 + r, tMois) - m * (Math.pow(1 + r, tMois) - 1) / r;
  return Math.max(0, crd);
}

// CRD PTZ after t years (linear amortization after differe)
function crdPTZ(montant, differe, dureeRemboursement, tAns) {
  if (montant <= 0) return 0;
  if (tAns <= differe) return montant;
  const rem = tAns - differe;
  if (rem >= dureeRemboursement) return 0;
  return montant * (1 - rem / dureeRemboursement);
}

// ─── Full simulation ──────────────────────────────────────────────────────────
function simulate(params) {
  const {
    revenuNet, rfr, apport, zone,
    tauxEmprunt, dureeEmprunt,
    prixNeuf, surfaceNeuf, fraisNotaireNeuf, chargesNeuf, taxeNeuf, apprecNeuf,
    prixAncien, surfaceAncien, travaux, fraisNotaireAncien, chargesAncien, taxeAncien, apprecAncien,
    loyer, surfaceLoue, indexationLoyer,
    horizon, tauxOpp, fraisRevente, detentionMin,
  } = params;

  // ── NEUF ──────────────────────────────────────────────────────────────────
  const fraisNotaireNeufAmt = prixNeuf * (fraisNotaireNeuf / 100);
  const coutTotalNeuf = prixNeuf + fraisNotaireNeufAmt;
  const ptzNeuf = calcPTZ(true, zone, rfr, prixNeuf, 0, prixNeuf);
  const besoinNeuf = Math.max(0, coutTotalNeuf - apport - (ptzNeuf.eligible ? ptzNeuf.montant : 0));
  const pretNeuf = besoinNeuf;
  const mensNeuf = mensualiteEmprunt(pretNeuf, tauxEmprunt / 100, dureeEmprunt);
  const mensCapMax = revenuNet * 0.35;
  const pretMaxNeuf = mensCapMax > 0
    ? mensCapMax * (1 - Math.pow(1 + tauxEmprunt / 1200, -(dureeEmprunt * 12))) / (tauxEmprunt / 1200)
    : 0;
  const effNeuf = ptzNeuf.eligible
    ? (mensNeuf + (ptzNeuf.differe === 0 ? ptzNeuf.mensualite : 0)) / revenuNet
    : mensNeuf / revenuNet;

  // ── ANCIEN ─────────────────────────────────────────────────────────────────
  const fraisNotaireAncienAmt = prixAncien * (fraisNotaireAncien / 100);
  const coutTotalAncien = prixAncien + travaux + fraisNotaireAncienAmt;
  const ptzAncien = calcPTZ(false, zone, rfr, prixAncien + travaux, travaux, prixAncien);
  const besoinAncien = Math.max(0, coutTotalAncien - apport - (ptzAncien.eligible ? ptzAncien.montant : 0));
  const pretAncien = besoinAncien;
  const mensAncien = mensualiteEmprunt(pretAncien, tauxEmprunt / 100, dureeEmprunt);
  const effAncien = ptzAncien.eligible
    ? (mensAncien + (ptzAncien.differe === 0 ? ptzAncien.mensualite : 0)) / revenuNet
    : mensAncien / revenuNet;

  // ── YEAR-BY-YEAR ──────────────────────────────────────────────────────────
  const rows = [];
  let cumSortiesNeuf = 0, cumSortiesAncien = 0, cumLoyer = 0;

  for (let t = 0; t <= Math.max(horizon, 30); t++) {
    if (t === 0) {
      // Year 0: apport + notaire + travaux paid upfront
      cumSortiesNeuf = apport + fraisNotaireNeufAmt;
      cumSortiesAncien = apport + travaux + fraisNotaireAncienAmt;

      rows.push({
        t,
        sortiesNeuf: cumSortiesNeuf,
        sortiesAncien: cumSortiesAncien,
        cumulLoyer: 0,
        crdNeuf: pretNeuf,
        crdPtzNeuf: ptzNeuf.eligible ? ptzNeuf.montant : 0,
        crdAncien: pretAncien,
        crdPtzAncien: ptzAncien.eligible ? ptzAncien.montant : 0,
        valNeuf: prixNeuf,
        valAncien: prixAncien + travaux,
        gainOpp: 0,
        coutNeuf: cumSortiesNeuf - (prixNeuf - pretNeuf - (ptzNeuf.eligible ? ptzNeuf.montant : 0)),
        coutAncien: cumSortiesAncien,
        coutLocation: 0,
      });
      continue;
    }

    // Annual outflows for year t
    // PTZ: t in years, differe in years
    const ptzDiffNeuf = ptzNeuf.eligible ? ptzNeuf.differe : 999;
    const ptzDurNeuf = ptzNeuf.eligible ? ptzNeuf.duree : 999;
    const mensNeufPTZ = ptzNeuf.eligible && t > ptzDiffNeuf && t <= ptzDurNeuf ? ptzNeuf.mensualite : 0;
    const mensNeufTot = (t <= dureeEmprunt ? mensNeuf : 0) + mensNeufPTZ;

    const ptzDiffAncien = ptzAncien.eligible ? ptzAncien.differe : 999;
    const ptzDurAncien = ptzAncien.eligible ? ptzAncien.duree : 999;
    const mensAncienPTZ = ptzAncien.eligible && t > ptzDiffAncien && t <= ptzDurAncien ? ptzAncien.mensualite : 0;
    const mensAncienTot = (t <= dureeEmprunt ? mensAncien : 0) + mensAncienPTZ;

    const sortiesAnnNeuf = mensNeufTot * 12 + chargesNeuf + taxeNeuf;
    const sortiesAnnAncien = mensAncienTot * 12 + chargesAncien + taxeAncien;

    cumSortiesNeuf += sortiesAnnNeuf;
    cumSortiesAncien += sortiesAnnAncien;

    // Loyer year t (indexé)
    const loyerAnn = loyer * 12 * Math.pow(1 + indexationLoyer / 100, t - 1);
    cumLoyer += loyerAnn;

    // CRD
    const crdN = crdPrincipal(pretNeuf, tauxEmprunt / 100, dureeEmprunt, t * 12);
    const crdPtzN = ptzNeuf.eligible
      ? crdPTZ(ptzNeuf.montant, ptzNeuf.differe, ptzNeuf.dureeRemboursement, t)
      : 0;
    const crdA = crdPrincipal(pretAncien, tauxEmprunt / 100, dureeEmprunt, t * 12);
    const crdPtzA = ptzAncien.eligible
      ? crdPTZ(ptzAncien.montant, ptzAncien.differe, ptzAncien.dureeRemboursement, t)
      : 0;

    // Asset values
    const valN = prixNeuf * Math.pow(1 + apprecNeuf / 100, t);
    const valA = (prixAncien + travaux) * Math.pow(1 + apprecAncien / 100, t);

    // Patrimoine brut
    const patBrutNeuf = valN - crdN - crdPtzN;
    const patBrutAncien = valA - crdA - crdPtzA;

    // Opportunity gain (apport not invested in property)
    const gainOpp = apport * (Math.pow(1 + tauxOpp / 100, t) - 1);

    const coutNeuf = cumSortiesNeuf - patBrutNeuf;
    const coutAncien = cumSortiesAncien - patBrutAncien;
    const coutLocation = cumLoyer - gainOpp;

    rows.push({
      t,
      sortiesNeuf: cumSortiesNeuf,
      sortiesAncien: cumSortiesAncien,
      cumulLoyer: cumLoyer,
      crdNeuf: crdN,
      crdPtzNeuf: crdPtzN,
      crdAncien: crdA,
      crdPtzAncien: crdPtzA,
      valNeuf: valN,
      valAncien: valA,
      gainOpp,
      coutNeuf,
      coutAncien,
      coutLocation,
      mensNeufTot,
      mensAncienTot,
      loyerAnn,
      patBrutNeuf,
      patBrutAncien,
      sortiesAnnNeuf,
      sortiesAnnAncien,
    });
  }

  return {
    ptzNeuf, ptzAncien,
    pretNeuf, pretAncien,
    mensNeuf, mensAncien,
    effNeuf, effAncien,
    mensCapMax, pretMaxNeuf,
    fraisNotaireNeufAmt, fraisNotaireAncienAmt,
    coutTotalNeuf, coutTotalAncien,
    rows,
  };
}

// ─── Slider component ─────────────────────────────────────────────────────────
function Slider({ label, value, min, max, step = 1, onChange, format, hint, color = '' }) {
  const display = format ? format(value) : value;
  return (
    <div className="mb-4">
      <div className="flex justify-between items-baseline mb-1">
        <span className="text-xs font-semibold uppercase tracking-wide text-slate-500">{label}</span>
        <span className="mono text-sm font-bold text-slate-800">{display}</span>
      </div>
      <input
        type="range" min={min} max={max} step={step} value={value}
        onChange={e => onChange(Number(e.target.value))}
        className={`w-full accent-slate-800 ${color}`}
        style={{ background: `linear-gradient(to right, ${color === 'amber' ? '#d97706' : color === 'violet' ? '#7c3aed' : color === 'emerald' ? '#059669' : '#1e293b'} 0%, ${color === 'amber' ? '#d97706' : color === 'violet' ? '#7c3aed' : color === 'emerald' ? '#059669' : '#1e293b'} ${((value - min) / (max - min)) * 100}%, #cbd5e1 ${((value - min) / (max - min)) * 100}%, #cbd5e1 100%)` }}
      />
      {hint && <p className="text-xs text-slate-400 mt-0.5">{hint}</p>}
    </div>
  );
}

// ─── Section card ─────────────────────────────────────────────────────────────
function Card({ title, color = 'slate', children, className = '' }) {
  const border = { slate: 'border-slate-200', amber: 'border-amber-200', violet: 'border-violet-200', emerald: 'border-emerald-200' };
  const header = { slate: 'bg-slate-800 text-white', amber: 'bg-amber-600 text-white', violet: 'bg-violet-700 text-white', emerald: 'bg-emerald-700 text-white' };
  return (
    <div className={`rounded-xl border ${border[color]} overflow-hidden ${className}`}>
      {title && <div className={`px-4 py-2.5 text-sm font-bold ${header[color]}`}>{title}</div>}
      <div className="p-4 bg-white">{children}</div>
    </div>
  );
}

// ─── Alert ────────────────────────────────────────────────────────────────────
function Alert({ type = 'red', children }) {
  const cls = type === 'red'
    ? 'bg-red-50 border-red-300 text-red-800'
    : 'bg-amber-50 border-amber-300 text-amber-800';
  return <div className={`rounded-lg border px-3 py-2 text-xs mt-2 ${cls}`}>{children}</div>;
}

// ─── PTZ Block ────────────────────────────────────────────────────────────────
function PTZBlock({ title, ptz, color }) {
  if (!ptz.eligible) {
    return (
      <Card title={title} color={color}>
        <div className="bg-slate-50 rounded-lg p-3 text-center">
          <span className="text-2xl">⛔</span>
          <p className="text-xs font-semibold text-slate-500 mt-1">Non éligible</p>
          <p className="text-xs text-slate-400 mt-1">{ptz.raison}</p>
        </div>
      </Card>
    );
  }
  return (
    <Card title={title} color={color}>
      <div className="grid grid-cols-2 gap-2 text-center mb-3">
        <div className="bg-slate-50 rounded-lg p-2">
          <div className="text-xs text-slate-500 uppercase">Tranche</div>
          <div className="text-xl font-black text-slate-800">{ptz.tranche}</div>
        </div>
        <div className="bg-slate-50 rounded-lg p-2">
          <div className="text-xs text-slate-500 uppercase">Quotité</div>
          <div className="text-xl font-black text-slate-800">{Math.round(ptz.quotite * 100)} %</div>
        </div>
        <div className="bg-slate-50 rounded-lg p-2">
          <div className="text-xs text-slate-500 uppercase">Différé</div>
          <div className="text-xl font-black text-slate-800">{ptz.differe} ans</div>
        </div>
        <div className="bg-slate-50 rounded-lg p-2">
          <div className="text-xs text-slate-500 uppercase">Durée totale</div>
          <div className="text-xl font-black text-slate-800">{ptz.duree} ans</div>
        </div>
      </div>
      <div className="bg-green-50 rounded-lg p-3 text-center">
        <div className="text-xs text-green-700 uppercase font-semibold">Montant PTZ</div>
        <div className="text-2xl font-black text-green-800">{fmtE(Math.round(ptz.montant))}</div>
        <div className="text-xs text-green-600 mt-1">
          {ptz.differe > 0 ? `0 €/mois pendant ${ptz.differe} ans, puis ` : ''}
          {fmtE(Math.round(ptz.mensualite))}/mois sur {ptz.dureeRemboursement} ans
        </div>
      </div>
    </Card>
  );
}

// ─── Financing plan ───────────────────────────────────────────────────────────
function PlanFinancement({ title, prixBien, travaux, fraisNotaire, apport, ptz, pretPrincipal, mensualite, eff, mensCapMax, pretMax, color }) {
  const overtauxEffort = eff > 0.35;
  const overCapacite = pretPrincipal > pretMax && pretMax > 0;
  return (
    <Card title={title} color={color}>
      <table className="w-full text-xs">
        <tbody>
          <tr className="border-b border-slate-100">
            <td className="py-1.5 text-slate-600">Prix du bien</td>
            <td className="py-1.5 text-right mono font-semibold">{fmtE(Math.round(prixBien))}</td>
          </tr>
          {travaux > 0 && (
            <tr className="border-b border-slate-100">
              <td className="py-1.5 text-slate-600">Travaux</td>
              <td className="py-1.5 text-right mono font-semibold">+ {fmtE(Math.round(travaux))}</td>
            </tr>
          )}
          <tr className="border-b border-slate-100">
            <td className="py-1.5 text-slate-600">Frais de notaire</td>
            <td className="py-1.5 text-right mono font-semibold">+ {fmtE(Math.round(fraisNotaire))}</td>
          </tr>
          <tr className="border-b-2 border-slate-300 font-bold">
            <td className="py-1.5">Coût total</td>
            <td className="py-1.5 text-right mono">{fmtE(Math.round(prixBien + travaux + fraisNotaire))}</td>
          </tr>
          <tr className="border-b border-slate-100 text-green-700">
            <td className="py-1.5">− Apport personnel</td>
            <td className="py-1.5 text-right mono font-semibold">− {fmtE(Math.round(apport))}</td>
          </tr>
          {ptz.eligible && (
            <tr className="border-b border-slate-100 text-green-700">
              <td className="py-1.5">− PTZ</td>
              <td className="py-1.5 text-right mono font-semibold">− {fmtE(Math.round(ptz.montant))}</td>
            </tr>
          )}
          <tr className="border-b-2 border-slate-300 font-bold text-slate-800">
            <td className="py-1.5">= Prêt principal</td>
            <td className="py-1.5 text-right mono">{fmtE(Math.round(pretPrincipal))}</td>
          </tr>
          <tr className="border-b border-slate-100">
            <td className="py-1.5 text-slate-600">Mensualité prêt principal</td>
            <td className="py-1.5 text-right mono font-semibold">{fmtE(Math.round(mensualite))}/mois</td>
          </tr>
          {ptz.eligible && (
            <tr className="border-b border-slate-100">
              <td className="py-1.5 text-slate-600">Mensualité PTZ (après différé)</td>
              <td className="py-1.5 text-right mono font-semibold">{fmtE(Math.round(ptz.mensualite))}/mois</td>
            </tr>
          )}
          <tr className={`font-bold ${overtauxEffort ? 'text-red-700' : 'text-slate-800'}`}>
            <td className="py-1.5">Taux d'effort</td>
            <td className="py-1.5 text-right mono">{fmtPct(eff)}</td>
          </tr>
        </tbody>
      </table>
      {overtauxEffort && <Alert type="red">⚠️ Taux d'effort {fmtPct(eff)} &gt; 35 % (seuil HCSF). Risque de refus bancaire.</Alert>}
      {overCapacite && <Alert type="amber">⚠️ Prêt {fmtE(Math.round(pretPrincipal))} dépasse la capacité max estimée {fmtE(Math.round(pretMax))}.</Alert>}
    </Card>
  );
}

// ─── Main app ─────────────────────────────────────────────────────────────────
function App() {
  // Profile
  const [revenuNet, setRevenuNet] = useState(5000);
  const [rfr, setRfr] = useState(31500);
  const [apport, setApport] = useState(15000);
  const [zone, setZone] = useState('B1');

  // Loan
  const [tauxEmprunt, setTauxEmprunt] = useState(3.4);
  const [dureeEmprunt, setDureeEmprunt] = useState(25);

  // Neuf
  const [prixNeuf, setPrixNeuf] = useState(280000);
  const [surfaceNeuf, setSurfaceNeuf] = useState(42);
  const [fraisNotaireNeuf, setFraisNotaireNeuf] = useState(2.5);
  const [chargesNeuf, setChargesNeuf] = useState(2400);
  const [taxeNeuf, setTaxeNeuf] = useState(800);
  const [apprecNeuf, setApprecNeuf] = useState(1.5);

  // Ancien
  const [prixAncien, setPrixAncien] = useState(220000);
  const [surfaceAncien, setSurfaceAncien] = useState(45);
  const [travaux, setTravaux] = useState(25000);
  const [fraisNotaireAncien, setFraisNotaireAncien] = useState(7.5);
  const [chargesAncien, setChargesAncien] = useState(3200);
  const [taxeAncien, setTaxeAncien] = useState(1100);
  const [apprecAncien, setApprecAncien] = useState(1.2);

  // Location
  const [loyer, setLoyer] = useState(1320);
  const [surfaceLoue, setSurfaceLoue] = useState(42);
  const [indexationLoyer, setIndexationLoyer] = useState(2.0);

  // Simulation
  const [horizon, setHorizon] = useState(10);
  const [tauxOpp, setTauxOpp] = useState(3.0);
  const [fraisRevente, setFraisRevente] = useState(6.0);
  const [detentionMin, setDetentionMin] = useState(5);

  const params = {
    revenuNet, rfr, apport, zone,
    tauxEmprunt, dureeEmprunt,
    prixNeuf, surfaceNeuf, fraisNotaireNeuf, chargesNeuf, taxeNeuf, apprecNeuf,
    prixAncien, surfaceAncien, travaux, fraisNotaireAncien, chargesAncien, taxeAncien, apprecAncien,
    loyer, surfaceLoue, indexationLoyer,
    horizon, tauxOpp, fraisRevente, detentionMin,
  };

  const sim = useMemo(() => simulate(params), [
    revenuNet, rfr, apport, zone, tauxEmprunt, dureeEmprunt,

      <p className="text-center text-xs text-slate-400 mt-6">Simulateur immobilier · Données 2025-2026 · Calculs à titre indicatif</p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
